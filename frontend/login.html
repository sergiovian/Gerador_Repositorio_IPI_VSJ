<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#c8102e">
  <title>Entrar · Gestor de Cultos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <link href="assets/css/login.css?v=2" rel="stylesheet">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-hero">
      <div class="login-brand"><img src="assets/img/app-mark.svg" alt="Gestor de Cultos"><span>Gestor de Cultos</span></div>
      <div class="login-hero-copy">
        <h2>Planeje e conduza cada momento do culto.</h2>
        <p>Liturgia, músicas, projeção e histórico organizados em um só lugar.</p>
      </div>
    </section>
    <section class="login-panel">
      <div class="login-card">
        <img class="login-logo mb-4" src="assets/img/app-mark.svg" alt="Gestor de Cultos">
        <p class="login-kicker mb-2">Acesso da sua igreja</p>
        <h1 class="h2 mb-2">Bem-vindo</h1>
        <p class="text-secondary mb-4">Entre para acessar o ambiente da sua igreja.</p>
        <form id="login-form">
          <div class="mb-3"><label class="form-label" for="username">Usuário</label><input class="form-control" id="username" autocomplete="username" required autofocus></div>
          <div class="mb-3"><label class="form-label" for="password">Senha</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
          <p id="error" class="text-danger small d-none"></p>
          <button class="btn login-button w-100">Entrar no portal</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/';
    document.querySelector('#login-form').onsubmit = async event => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      button.disabled = true;
      const response = await fetch('/api/auth/user-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username.value, password: password.value }) });
      const json = await response.json().catch(() => ({}));
      if (!response.ok) {
        error.textContent = json.error?.message || json.message || 'Não foi possível entrar.';
        error.classList.remove('d-none');
        button.disabled = false;
        return;
      }
      location = next;
    };
  </script>
</body>
</html>
